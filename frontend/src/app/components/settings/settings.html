<div class="settings-scrim" (click)="close.emit()"></div>
<section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <header><div><span class="kicker">Skynet</span><h2 id="settings-title">Settings</h2></div><button type="button" aria-label="Close settings" (click)="close.emit()">×</button></header>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="system-prompt">System prompt</label>
    <p>Sets the model's behavior at the start of every request.</p>
    <textarea id="system-prompt" formControlName="systemPrompt" rows="11"></textarea>
    <button class="advanced-toggle" type="button" (click)="advanced = !advanced" [attr.aria-expanded]="advanced"><span>Advanced model settings</span><span>{{ advanced ? '−' : '+' }}</span></button>
    @if (advanced) {
      <div class="advanced-grid">
        <label>Temperature <span>{{ form.controls.temperature.value }}</span><input type="range" formControlName="temperature" min="0" max="2" step="0.05"></label>
        <label>Top P <span>{{ form.controls.topP.value }}</span><input type="range" formControlName="topP" min="0" max="1" step="0.01"></label>
        <label>Max tokens<input type="number" formControlName="maxTokens" min="1" max="131072"></label>
      </div>
    }
    <footer><button class="reset" type="button" (click)="reset.emit()">Reset defaults</button><span></span><button class="cancel" type="button" (click)="close.emit()">Cancel</button><button class="save" type="submit" [disabled]="form.invalid">Save settings</button></footer>
  </form>
</section>
