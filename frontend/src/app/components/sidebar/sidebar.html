<div class="scrim" [class.visible]="open()" (click)="closeSidebar.emit()"></div>
<aside class="sidebar" [class.open]="open()" aria-label="Conversation navigation">
  <div class="brand-row">
    <div class="brand-mark" aria-hidden="true"><span></span></div>
    <div>
      <strong>Local AI</strong>
      <small>Private workspace</small>
    </div>
    <button class="icon-button mobile-close" type="button" aria-label="Close conversations" (click)="closeSidebar.emit()">×</button>
  </div>

  <button class="new-chat" type="button" (click)="newChat.emit()">
    <span aria-hidden="true">＋</span>
    New chat
    <kbd>⌘ N</kbd>
  </button>

  <div class="section-label">Conversations</div>
  <nav class="conversation-list" aria-label="Saved conversations">
    @for (conversation of conversations(); track conversation.id) {
      <div class="conversation-row" [class.active]="conversation.id === activeId()">
        <button type="button" class="conversation" (click)="selectChat.emit(conversation.id)">
          <span class="conversation-icon" aria-hidden="true">⌁</span>
          <span class="conversation-copy"><strong>{{ conversation.title }}</strong><small>{{ conversation.updatedAt | date:'MMM d · HH:mm' }}</small></span>
        </button>
        <button class="delete-button" type="button" aria-label="Delete conversation" (click)="remove($event, conversation.id)">×</button>
      </div>
    }
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="settings-button" (click)="openSettings.emit()">
      <span aria-hidden="true">⚙</span>
      <span><strong>Settings</strong><small>Prompt & model controls</small></span>
      <span aria-hidden="true">›</span>
    </button>
    <div class="local-note"><span aria-hidden="true">◆</span> Runs on this machine</div>
  </div>
</aside>
