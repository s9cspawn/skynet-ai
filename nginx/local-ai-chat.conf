server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name skynet-2026.duckdns.org _;

    ssl_certificate /etc/letsencrypt/live/skynet-2026.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skynet-2026.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SkynetSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/local-ai-chat/browser;
    index index.html;

    client_max_body_size 256k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;

        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
